                  - heading "Mon parcours" [level=3] [ref=e89]
                  - paragraph [ref=e92]: "Depuis toujours, la coiffure est plus qu’un métier : c’est une vocation. Formé dans les plus grandes maisons…dont JEAN LOUIS DAVID. J’ai appris l’exigence, la rigueur et l’élégance du geste. Ce parcours m’a permis d’affiner mon oeil, de maîtriser les fondamentaux, puis de créer ma propre vision. Aujourd’hui, chaque prestation est le fruit de cette double richesse ; un héritage classique allié à une liberté artistique. Une expertise que j’ai nourril’international, au contact de culture et de"

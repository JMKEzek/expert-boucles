                  - heading "Ma Passion" [level=3] [ref=e107]
                  - paragraph [ref=e110]:
                    - text: Ce qui me passionne, c’est la transformation.
                    - text: Voir une cliente se réapproprier sa texture,
                    - text: apprendre à aimer ce que d’autres lui ont
                    - text: appris à cacher – c’est ça, ma motivation
                    - text: profonde.
                    - text: Les cheveux bouclés sont vivants,
                    - text: changeants, puissants. Ils racontent quelque
                    - text: chose. Et mon rôle, c’est de les révéler avec
                    - text: respect, finesse, et style.
                    - text: Plus qu’un résultat, e cherche une émotion.
                    - text: Une coupe réussie, c’est une posture qui
                    - text: change, un regard qui s’allume.

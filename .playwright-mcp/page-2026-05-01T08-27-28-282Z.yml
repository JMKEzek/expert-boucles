                  - paragraph [ref=e100]:
                    - text: Avant de couper, j’écoute.
                    - text: Ma méthode commence toujours par un
                    - text: "diagnostic complet : habitudes, fréquence de"
                    - text: lavage, historique capillaire, besoins
                    - text: spécifiques du cuir chevelu, nature des
                    - text: produits utilisés..
                    - text: Je m’appuie sur une analyse fine pour
                    - text: comprendre votre boucle dans toute sa
                    - text: singularité. Car aucune routine ne peut être
                    - text: universelle – chaque texture demande une
                    - text: lecture personnalisée.
                    - text: Mon approche repose sur l’ajustement, la
                    - text: précision et la bienveillance. Chaque détail
                    - text: compte pour sublimer vos boucles..
                    - text: durablement.

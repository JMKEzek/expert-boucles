              - heading "2. Réservations des prestations" [level=2] [ref=e79]
              - paragraph [ref=e80]:
                - text: Les prestations proposées sur le site sont accessibles uniquement sur rendez-vous, via le site www.expertboucles.com.
                - text: • L’âge minimum requis pour réserver est de 14 ans.
                - text: • Un diagnostic personnalisé ainsi qu’un shampooing sont systématiquement inclus dans chaque prestation.
                - text: • La réservation est considérée comme confirmée uniquement après paiement en ligne.
              - heading "3 – Modification d’un rendez-vous" [level=2] [ref=e81]
              - paragraph [ref=e82]: Les demandes de modification sont possibles jusqu’à 48 heures avant la date du rendez-vous.
              - paragraph [ref=e83]: "Procédure:"
              - paragraph [ref=e84]:
                - text: 1. Envoyer un email à contact@expert-boucles.com
                - text: 2. Indiquer vos coordonnées, la date et l’heure initialement réservées, ainsi que vos nouvelles disponibilités.
              - paragraph [ref=e85]: Une confirmation sera envoyée par email selon les créneaux restants disponibles.
              - heading "4 – Annulation et remboursement" [level=2] [ref=e86]
              - paragraph [ref=e87]: Vous pouvez annuler votre rendez-vous dans un délai de 72 heures suivant la prise deréservation.
              - paragraph [ref=e88]:
                - text: "Procédure:"
                - text: 1. Envoyer un email à contact@expert-boucles.com
                - text: 2. Indiquer vos coordonnées, la date du rendez-vous concerné et le motif de votreannulation.
              - paragraph [ref=e89]:
                - text: "Conditions:"
                - text: Le remboursement est effectué sous 7 jours, via le même mode de paiement utilisé.
                - text: Les frais de transaction restent à la charge du client.
                - text: Aucun remboursement ne sera possible une fois la prestation réalisée.
              - heading "5 – Retard et absence" [level=2] [ref=e90]
              - paragraph [ref=e91]: • En cas de retard supérieur à 15 minutes, la prestation pourra être écourtée ou annulée sans remboursement.• En cas de non-présentation sans avertissement, la prestation est considérée comme due et ne pourra être ni reportée ni remboursée.
              - heading "6 – Tarifs et paiement" [level=2] [ref=e92]
              - paragraph [ref=e93]:
                - text: Les tarifs sont indiqués en euros TTC.
                - text: Le paiement est effectué de manière sécurisée via la passerelle intégrée au site.
                - text: Aucun paiement en espèces n’est accepté pour la réservation en ligne.1
              - heading "7 – Propriété intellectuelle" [level=2] [ref=e94]
              - paragraph [ref=e95]:
                - text: Tous les contenus présents sur le site (textes, images, visuels, logo Expert Boucles…) sont protégés par la législation sur la propriété intellectuelle.
                - text: Toute reproduction, représentation ou diffusion, même partielle, est interdite sans autorisation écrite préalable.
              - heading "8 – Droit applicable et litiges" [level=2] [ref=e96]
              - paragraph [ref=e97]:
                - text: Les présentes conditions sont soumises au droit français.
